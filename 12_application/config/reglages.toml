# Réglages de l'application : valeur et motif de chacun.
#
# Versionné, lu et validé au démarrage par `application.config`, seul lecteur ; une
# valeur fautive, un texte absent : l'application refuse de démarrer. La clé de l'API
# vit dans `.env` (hors dépôt, modèle : `.env.example`), jamais ici.

[api]
adresse = "http://127.0.0.1:8010"
identite = "libraire-demo"
motif = "L'API du modèle, sur le poste : 8010, le port de son module. Surchargeable : API_MODELE_ADRESSE. L'identité est fixe tant qu'il n'y a pas de comptes ; l'API la recopie dans son journal."

[api.delais]
connexion_s = 5.0
reponse_s = 75.0
info_s = 5.0
sante_s = 5.0
motif = "La réponse : 75 s couvre largement le mesuré (p95 de 2,1 à 9,5 s sur les profils proposés, 2026-10-30 à 11-03), pas le pire cas théorique de l'API (90 à 240 s) ; attendre davantage devant une page ne sert personne. Au-delà, l'écran le dit, et l'appel peut continuer côté API. L'état du service : 5 s, sans attendre."

[api.attentes]
debit_defaut_s = 60
fournisseur_defaut_s = 2
motif = "Ce que l'écran annonce si la réponse ne porte pas de Retry-After lisible : la fenêtre du débit de l'API, une minute ; l'attente du nouvel essai de l'API, 2 s."

[reglages]
temperature_defaut = 0.0
reformuler_defaut = true
mode_demonstration_defaut = false
profils_exclus = ["mistral-large-4"]
motif = "0 : la seule valeur mesurée. mistral-large-4 n'est pas proposé tant qu'il n'est pas remesuré : en aperçu, raisonnement instable. Une position hors des bornes de l'API n'est pas proposée. Le mode démonstration est éteint : c'est la production ; il ne change que ce que la page affiche, jamais la requête."

[[reglages.positions]]
valeur = 0.0
nom = "stable"
etiquette = "Stable (0) : le réglage le plus bas ; le texte, parfois les séries, peuvent changer."
motif = "Le défaut : ce qu'un conseil sourcé veut. Aucune graine n'est envoyée : le 2026-11-04, sur une question posée cinq fois à 0, le texte a changé chaque fois, et une troisième série est venue en carte à la cinquième."

[[reglages.positions]]
valeur = 0.3
nom = "modérée"
etiquette = "Modérée (0,3) : varie un peu."
motif = "La candidate pour la production de l'épreuve E4 ; elle ne devient défaut qu'après un rejeu des 26 questions à cette température."

[[reglages.positions]]
valeur = 0.7
nom = "variée"
etiquette = "Variée (0,7) : varie d'un essai à l'autre."
motif = "Le contraste avec 0, à montrer ; élevé pour un usage réel."

[conversation]
question_caracteres_max = 500
echanges = 5
tours_max = 10
caracteres_max = 4000
tour_caracteres_max = 2000
motif = "Les bornes de l'API, recopiées : celles que /v1/info publie sont revérifiées à chaque lecture, un écart est journalisé et la valeur de l'API l'emporte. La longueur d'un tour n'y est pas publiée : un test la compare au contrat."

[corps]
octets_max = 16384
motif = "Une question et un historique plein, encodés en formulaire, tiennent en 6,5 Kio environ pour un texte français (estimation) ; au-delà de 16 Kio, le corps est refusé avant d'être lu."

[ecoute]
hote = "127.0.0.1"
port = 8020
motif = "Sur le bouclage du poste. 8020, à côté de l'API : 8000 est au module 02, 8080 à un autre projet du poste. Surchargeable : APPLICATION_ECOUTE (hôte:port)."

[metriques]
reseaux = ["127.0.0.1/32", "::1/128"]
motif = "/metrics ne répond qu'au bouclage, 404 ailleurs. Dans un conteneur, le client n'est pas le bouclage : surchargeable, APPLICATION_METRIQUES_RESEAUX (réseaux séparés par des virgules)."

[fournisseurs.mistral]
nom = "Mistral"
hebergement = "Union européenne"

[fournisseurs.openai]
nom = "OpenAI"
hebergement = "hors Union européenne par défaut"

