# Réglages de l'application : valeur et motif de chacun.
#
# Versionné, lu et validé au démarrage par `application.config`, seul lecteur ; une
# valeur fautive, un texte absent : l'application refuse de démarrer. La clé de l'API
# vit dans `.env` (hors dépôt, modèle : `.env.example`), jamais ici.

[api]
adresse = "http://127.0.0.1:8010"
identite = "libraire-demo"
motif = "L'API du modèle, sur le poste : 8010, le port de son module. Surchargeable : API_MODELE_ADRESSE. L'identité est fixe tant qu'il n'y a pas de comptes ; l'API la recopie dans son journal."

[api.delais]
connexion_s = 5.0
reponse_s = 75.0
info_s = 5.0
sante_s = 5.0
verification_s = 15.0
motif = "Le test des clés (E4, lot 5) : 15 s — l'API interroge chaque fournisseur en parallèle, chacun borné à 5 s par son module. La réponse : 75 s couvre largement le mesuré (p95 de 2,1 à 9,5 s sur les profils proposés, 2026-10-30 à 11-03), pas le pire cas théorique de l'API (90 à 240 s) ; attendre davantage devant une page ne sert personne. Au-delà, l'écran le dit, et l'appel peut continuer côté API. L'état du service : 5 s, sans attendre."

[api.attentes]
debit_defaut_s = 60
fournisseur_defaut_s = 2
motif = "Ce que l'écran annonce si la réponse ne porte pas de Retry-After lisible : la fenêtre du débit de l'API, une minute ; l'attente du nouvel essai de l'API, 2 s."

[reglages]
temperature_defaut = 0.0
reformuler_defaut = true
mode_demonstration_defaut = false
profils_exclus = ["mistral-large-4"]
motif = "0 : la seule valeur mesurée. mistral-large-4 n'est pas proposé tant qu'il n'est pas remesuré : en aperçu, raisonnement instable. Une position hors des bornes de l'API n'est pas proposée. Le mode démonstration est éteint : c'est la production ; il ne change que ce que la page affiche, jamais la requête."

[[reglages.positions]]
valeur = 0.0
nom = "stable"
etiquette = "Stable (0) : le réglage le plus bas ; le texte, parfois les séries, peuvent changer."
motif = "Le défaut : ce qu'un conseil sourcé veut. Aucune graine n'est envoyée : le 2026-11-04, sur une question posée cinq fois à 0, le texte a changé chaque fois, et une troisième série est venue en carte à la cinquième."

[[reglages.positions]]
valeur = 0.3
nom = "modérée"
etiquette = "Modérée (0,3) : varie un peu."
motif = "La candidate pour la production de l'épreuve E4 ; elle ne devient défaut qu'après un rejeu des 26 questions à cette température."

[[reglages.positions]]
valeur = 0.7
nom = "variée"
etiquette = "Variée (0,7) : varie d'un essai à l'autre."
motif = "Le contraste avec 0, à montrer ; élevé pour un usage réel."

[conversation]
question_caracteres_max = 500
echanges = 5
tours_max = 10
caracteres_max = 4000
tour_caracteres_max = 2000
motif = "Les bornes de l'API, recopiées : celles que /v1/info publie sont revérifiées à chaque lecture, un écart est journalisé et la valeur de l'API l'emporte. La longueur d'un tour n'y est pas publiée : un test la compare au contrat."

[corps]
octets_max = 16384
motif = "Une question et un historique plein, encodés en formulaire, tiennent en 6,5 Kio environ pour un texte français (estimation) ; au-delà de 16 Kio, le corps est refusé avant d'être lu."

[ecoute]
hote = "127.0.0.1"
port = 8020
motif = "Sur le bouclage du poste. 8020, à côté de l'API : 8000 est au module 02, 8080 à un autre projet du poste. Surchargeable : APPLICATION_ECOUTE (hôte:port)."

[metriques]
reseaux = ["127.0.0.1/32", "::1/128"]
motif = "/metrics ne répond qu'au bouclage, 404 ailleurs. Dans un conteneur, le client n'est pas le bouclage : surchargeable, APPLICATION_METRIQUES_RESEAUX (réseaux séparés par des virgules)."

[comptes]
duree_session_s = 28800
echecs_avant_verrou = 5
duree_verrou_s = 900
pseudo_min = 3
pseudo_max = 30
mot_de_passe_min = 12
mot_de_passe_max = 128
nom_affiche_max = 60
delai_base_s = 3.0
par_page = 25
listes_max_par_etat = 50
motif = "La session vit 8 h après la dernière page (une journée de travail en librairie), puis se rouvre par la connexion ; l'expiration est vérifiée côté serveur. Cinq échecs consécutifs posent un verrou de 15 minutes (E4, lot 1, décision 8). Pseudo de 3 à 30 caractères et nom affiché de 60 au plus : les bornes de la migration 027, recopiées et comparées par un test ; mot de passe de 12 à 128 sans règle de composition (décision 7, NIST SP 800-63B). La base se joint, répond à une instruction et rend un verrou en 3 s, ou elle est tenue pour indisponible ; 25 comptes par page d'administration. Une liste du client (favori, à lire, à commander) : 50 séries au plus (E4, lot 4) — la page « Mes listes » demande au catalogue le titre de chacune, en parallèle, et n'a pas de pagination ; au-delà, l'ajout est refusé par un écran nommé."

[catalogue]
adresse = "http://127.0.0.1:8000"
par_page = 20
q_min = 2
q_max = 100
motif = "L'API data du module 02 (contrat 0.5.0), sur le poste : 8000 est au module 02 ; dans la pile, CATALOGUE_ADRESSE. Sa clé (APPLICATION_CLE_CATALOGUE) vit dans .env ; absente en développement, le catalogue est « non configuré » et le reste fonctionne. 20 séries par page, 50 au plus : la borne de l'API data. La saisie de 2 à 100 caractères : les bornes de GET /series, recopiées et comparées au contrat par un test."

[catalogue.delais]
connexion_s = 3.0
reponse_s = 5.0
motif = "La recherche répond en 116 ms de médiane sur le poste (2026-11-08) : 5 s couvrent une base lente ; au-delà, l'encart le dit et le conseiller reste accessible."

[critiques]
texte_min = 50
texte_max = 2000
par_page = 25
labels = [
  { code = "coup_de_coeur",      libelle = "Coup de cœur" },
  { code = "decouverte_du_mois", libelle = "Découverte du mois" },
  { code = "a_offrir",           libelle = "À offrir" },
  { code = "pour_debuter",       libelle = "Pour débuter" },
  { code = "valeur_sure",        libelle = "Valeur sûre" },
]
motif = "Une critique de libraire : de 50 à 2 000 caractères (la migration 027 admet de 1 à 10 000 ; les bornes métier, plus serrées, sont tenues par l'application et comparées à la 027 par un test). Note entière de 0 à 10, obligatoire ; un label au plus, facultatif, pris dans cette liste fixe — modifiable ici sans code, chaque code de la forme ^[a-z_]{1,40}$ (celle de la 027) et unique. 25 critiques par page de liste (« Mes critiques », modération)."

[conseiller.limites]
quota_visiteur_questions_jour = 5
quota_client_questions_jour = 20
debit_public_par_minute = 10
cout_jour_max_usd = 0.50
inscriptions_session_max = 3
inscriptions_fenetre_min = 60
motif = "Les bornes du conseiller public (E4, lot 2b ; chiffres des quotas décidés par Max le 2026-11-09). Un visiteur : 5 questions par jour civil UTC, compteur dans le cookie de la session — de quoi essayer le conseiller. Un compte client : 20 par jour civil UTC, persisté par compte — un compte doit donner plus de questions qu'aucun compte ; libraires et administrateur n'ont pas de quota. La clé publique : 10 appels par minute, fenêtre glissante — la marge de 5 / min laissée aux comptes sous le plafond Mistral de 15 / min. Le coût : 0,50 $ par jour, environ 250 questions au coût mesuré, persisté par jour, profil et mode, relu avant chaque appel. L'inscription : 3 comptes par heure et par session. Un cookie effacé remet à zéro les compteurs de session, pas celui d'un compte."

[administration]
procedure_cles = "https://github.com/TheMaxfly/certification-Dev_IA/blob/main/11_api_modele/README.md#poser-ou-changer-une-cl%C3%A9"
motif = "La procédure de pose et de rotation des clés des fournisseurs (E4, lot 5, décision Q4) : un document public du dépôt, pas une procédure dans l'écran. Sur main, à jour à la livraison du lot."

[couts]
budget_projet_usd = 20
cout_anterieur_usd = 0.709557
historique_jours = 30
motif = "Le budget du projet : 20 $, fixé à l'ouverture d'E3. La dépense antérieure à la table couts_jour (E4, lot 2b) : 0,709557 $, la dépense d'E3, relevée le 2026-11-09 dans le rapport de l'inspection du point 0 d'E4 (tableau F.2 : étapes 3, 4, 5 et 6 d'E3, 383 appels au moins ; l'étape 5 est estimée par l'API), arrêtée par Max le 2026-11-09 ; avant E3 : non établie ; Max corrige s'il le faut. Le total du projet = la table + cette valeur. 30 jours d'historique sur la page des coûts."

[monitorage]
adresse_grafana = ""
motif = "L'adresse du tableau de bord Grafana du module 13 (publié sur le poste, 127.0.0.1:3000 dans la pile) : facultative, vide par défaut — la page des services n'en fait alors pas de lien. Grafana reste l'outil de fond (E5) ; la page des services ne lit que l'instant."

[fournisseurs.mistral]
nom = "Mistral"
hebergement = "Union européenne"

[fournisseurs.openai]
nom = "OpenAI"
hebergement = "hors Union européenne par défaut"

