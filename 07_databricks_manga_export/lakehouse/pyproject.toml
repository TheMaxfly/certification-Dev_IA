[project]
name = "manga-lakehouse"
version = "0.2.0"
description = "Module 07 v2 — lakehouse Spark+Delta : contrôles qualité historisés du raw multi-snapshots (médaillon bronze/silver/gold), couche complémentaire consultative hors chemin critique."
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Versions FIGÉES et VÉRIFIÉES (Étape 0) :
#   - matrice officielle Delta : delta-spark 3.3.x ↔ Apache Spark 3.5.x ;
#   - image officielle apache/spark:3.5.9 ;
#   - couple testé en local mode sur le Java 8 de l'hôte (écriture/lecture Delta,
#     replaceWhere, mergeSchema, time travel) avant toute ligne de ce module.
# Spark 4.x est écarté : la matrice ne documente pas encore 4.1+ et l'hôte n'a
# pas de Java 17 (Spark 4 l'exige), ce qui casserait le chemin de test local.
dependencies = [
  "pyspark==3.5.9",
  "delta-spark==3.3.2",
  "typer>=0.12",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
# Point d'entrée unique de la CLI (pattern du projet : `def main(): app()`).
lakehouse = "lakehouse.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pyright]
typeCheckingMode = "basic"
# pyspark expose ses types via des stubs partiels ; on n'échoue pas sur eux.
reportMissingModuleSource = "none"
