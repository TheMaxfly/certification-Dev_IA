[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-modele"
# Version de l'API, sémantique : la majeure est le segment de l'adresse (`/v1/`).
version = "1.0.0"
description = "API du modèle : une question, les séries classées par le modèle d'embedding en service, avec leurs passages"
readme = "README.md"
requires-python = ">=3.12"
# Épinglées. numpy, pgvector, psycopg et typer : les versions du verrou du module 10,
# dont le classement est chargé par son chemin (tests/test_verrous.py compare les
# deux verrous). FastAPI, Starlette, Pydantic, Uvicorn, psycopg-pool : celles du
# module 02.
dependencies = [
    "fastapi==0.139.0",
    "numpy==2.5.3",
    "pgvector==0.5.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "service-embedding",
    "starlette==1.3.1",
    "typer==0.27.3",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
service-embedding = { path = "../09_service_embedding", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pyright]
# Exigence du module neuf : strict sur le code de l'API. `make verify` désigne
# l'interpréteur du module (--pythonpath) ; en local, celui de `.venv`.
include = ["src"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.bandit]
# Lancé sur src/ seulement ; aucune règle écartée.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
