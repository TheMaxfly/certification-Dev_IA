[project]
name = "manga-pipeline"
version = "0.1.0"
description = "Console de démonstration du pipeline ELT — orchestre les CLI existantes, n'implémente aucune logique métier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.7",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
manga-pipeline = "manga_pipeline.console:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
