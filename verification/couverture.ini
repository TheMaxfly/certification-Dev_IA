# Couverture mesurée par `make verify`, dans chaque module à tests (pytest-cov est à
# tous les verrous depuis le 2026-10-20) : le code du module, sans ses tests ni son
# environnement. Source : le dossier du module (`.`), sauf 09 et 10, mesurés sur leur
# paquet ; un fichier jamais importé compte alors pour 0 %, au lieu de disparaître.
[run]
omit =
    */tests/*
    */.venv/*
relative_files = true
