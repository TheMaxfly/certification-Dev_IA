name: verify

# Chaîne d'intégration continue : la même commande que sur le poste,
# `make verify MODULE=<nom>`, une tâche par module. Une tâche rouge bloque.
# Seule la tâche `indicatif` (Bandit, pip-audit) n'est jamais exigée.
# Détail des règles et des plafonds de tests sautés : Makefile,
# verification/verifier.sh, verification/sauts_attendus.tsv.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  # Image des bases jetables des tests (05, 09, 10, database), tirée par empreinte.
  MODULES_BASE_JETABLE: '["05", "09", "10", "database"]'

jobs:
  module:
    name: verify ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODULE: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", database, demo, workflows]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"

      - name: Java 8 (Spark, module 07)
        if: matrix.module == '07'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"

      - name: Image PostgreSQL des bases jetables, tirée par empreinte
        if: contains(fromJSON(env.MODULES_BASE_JETABLE), matrix.module)
        run: bash verification/verifier.sh image

      - name: Environnement du module, depuis son verrou
        run: bash verification/verifier.sh preparer "$MODULE"

      - name: make verify MODULE=${{ matrix.module }}
        run: make verify MODULE="$MODULE"

      - name: Pièces de l'exécution (JUnit, couverture, journal)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ matrix.module }}
          path: .verify/${{ matrix.module }}/
          if-no-files-found: ignore

  indicatif:
    name: indicatif (Bandit, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Jamais exigée pour fusionner : ses constats sont listés, pas bloquants.
    continue-on-error: true
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"

      - name: make verify-indicatif
        run: make verify-indicatif

      - name: Rapports Bandit et pip-audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indicatif
          path: .verify/
          if-no-files-found: ignore
