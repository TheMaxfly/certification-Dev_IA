name: indicatif

# Bandit et pip-audit sur les modules existants : jamais exigés, hors de la chaîne
# qui garde les fusions (palier 2). Chaque lundi, et à la main. Réussit dès que les
# deux outils ont tourné et produit leurs rapports, quel que soit le nombre de
# constats ; échoue si un outil plante ou si un rapport manque. Les tâches planifiées
# tournent sur la branche par défaut (`main`).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  indicatif:
    name: indicatif (Bandit, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"

      - name: make verify-indicatif
        run: make verify-indicatif

      - name: Rapports Bandit et pip-audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indicatif
          # `.verify/` est un dossier caché : sans include-hidden-files, l'action n'y
          # trouve rien (constaté sur les exécutions 37915436388 et 37915941227).
          path: |
            .verify/*/bandit.json
            .verify/*/audit.json
          include-hidden-files: true
          if-no-files-found: ignore
