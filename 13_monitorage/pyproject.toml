[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorage-modele"
version = "0.2.0"
description = "Le monitorage du modèle : collecte, tableaux de bord, alertes, sonde d'équivalence et exporteur de qualité."
readme = "README.md"
requires-python = ">=3.12"
# Épinglées. prometheus-client et psycopg : les versions du verrou du module 11. Le module
# 09 n'est pas une dépendance : son paquet se charge par son chemin (voir `service.py`).
dependencies = [
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    # La forme des tableaux de bord est validée par un schéma minimal.
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Les tests lisent les fichiers de provisionnement ; jamais à l'exécution.
    "pyyaml==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pyright]
# Exigence du module neuf : strict sur le code du module. `make verify` désigne
# l'interpréteur du module (--pythonpath) ; en local, celui de `.venv`.
include = ["src"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.bandit]
# Lancé sur src/ seulement ; aucune règle écartée.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "poste: joué sur le poste seulement, avec le Compose réel (MONITORAGE_ESSAI_POSTE=1)",
]
