# Tout vers un seul point de contact : regroupement 30 s, répétition 4 h. Le courriel
# d'exploitation ; pour un essai sans sortie, webhook-essai sur cette même ligne.
apiVersion: 1
policies:
  - orgId: 1
    receiver: courriel-exploitation
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 1m
    repeat_interval: 4h
