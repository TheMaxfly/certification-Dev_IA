<text x="1400.0" y="110" font-size="30" font-weight="bold" text-anchor="middle">MPD staging (annexe) — tables jetables</text>
<rect x="60" y="60" width="460" height="200" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="72" y="84" font-size="12">LEGENDE</text>
<text x="72" y="101" font-size="12">Les tables staging.* sont JETABLES : elles recoivent le fichier brut</text>
<text x="72" y="118" font-size="12">en TOUT-TEXT, sans typage et sans rejet. Le typage a lieu ensuite,</text>
<text x="72" y="135" font-size="12">en SQL, vers les tables manga.*.</text>
<text x="72" y="152" font-size="12">On ne detaille donc pas leurs colonnes : seules comptent leur</text>
<text x="72" y="169" font-size="12">existence et leurs colonnes techniques de tracabilite.</text>
