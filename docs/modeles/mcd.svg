<text x="72" y="84" font-size="12">LEGENDE — MCD (Merise)</text>
<text x="72" y="101" font-size="12">Entites METIER et associations, avec cardinalites (min,max).</text>
<text x="72" y="118" font-size="12">Ni type, ni cle technique : un MCD dit ce que le domaine contient,</text>
<text x="72" y="135" font-size="12">pas comment PostgreSQL le stocke.</text>
<text x="72" y="152" font-size="12">Lecture : SERIE-SOURCE (0,n) --designe--&gt; (0,1) OEUVRE se lit</text>
<text x="72" y="169" font-size="12">« une serie designe au plus une oeuvre ; une oeuvre est designee</text>
<text x="72" y="186" font-size="12">par zero a n series de sources differentes ».</text>
