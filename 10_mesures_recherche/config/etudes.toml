# Études — spec E2 jour 4, blocs C, D, E.
#
# Ce sont des ÉTUDES, pas des mesures : elles montrent quels réglages comptent, sans
# désigner de « meilleur réglage » — une grille essayée sur 59 questions trouve
# toujours un gagnant, qui doit beaucoup au hasard. Étiquette `etude` dans MLflow ;
# rien dans bench.eval_mesures ; aucun test de significativité. Tous les réglages
# sont déclarés ici avant toute exécution.

[mlflow]
# Expérience des études de la recherche (blocs C et D), à part des mesures.
experience = "E2-etudes-recherche"

[memoire]
# Règles de mémoire du projet : en dessous de 5 Go de mémoire vive disponible, ou
# avec du swap écrit dix secondes d'affilée, la combinaison en cours est arrêtée,
# sautée, nommée ; l'étude continue.
ram_disponible_min = 5_000_000_000
swap_continu_s = 10

# --------------------------------------------------------------------------- #
#  Bloc C — sensibilité du TF-IDF (36 combinaisons)
# --------------------------------------------------------------------------- #

[tfidf]
nom = "tfidf-sensibilite"
# Classement limité au catalogue, comme la mesure 9.
perimetre_entites = "catalogue"
# Réglages communs à toute la grille, ceux des mesures 6 et 9.
lowercase = true
strip_accents = "unicode"
norm = "l2"
similarite = "cosinus"
# La grille : 3 × 2 × 3 × 2 = 36 combinaisons.
sublinear_tf = [true, false]
min_df = [1, 2, 5]
max_df = [1.0, 0.5]
# Contrôle : la combinaison des mesures 6 et 9 (mots simples, sublinear_tf,
# min_df 2, max_df 1,0) doit redonner les métriques de la mesure 9.
temoin = { unite = "mots", sublinear_tf = true, min_df = 2, max_df = 1.0 }

[[tfidf.unites]]
nom = "mots"
analyzer = "word"
ngram_min = 1
ngram_max = 1

[[tfidf.unites]]
nom = "mots_et_paires"
analyzer = "word"
ngram_min = 1
ngram_max = 2

[[tfidf.unites]]
# Suites de 3 à 5 caractères prises à l'intérieur des mots (`char_wb`) : une faute
# d'orthographe ne touche que les suites qui la contiennent.
nom = "caracteres_3_5"
analyzer = "char_wb"
ngram_min = 3
ngram_max = 5

# --------------------------------------------------------------------------- #
#  Bloc D — les voisins : profondeur et mesure de distance (un seul run)
# --------------------------------------------------------------------------- #

[voisins]
nom = "voisins"
# Le classement étudié : celui de la mesure 8 (EmbeddingGemma, meilleur fragment,
# seules les séries du catalogue classées).
mesure = 8
# hit_rate pour ces nombres de résultats, global et par mode.
profondeurs = [1, 3, 5, 10, 20, 50]
# Les trois façons de rapprocher la question d'un fragment. La référence est celle
# que calcule la mesure 8 : le produit scalaire (vecteurs de longueur 1). Le
# cosinus divise en plus par les deux normes ; l'euclidienne classe par distance
# croissante. Attendu : les mêmes 10 premières entités pour les 69 questions.
distances = ["produit_scalaire", "cosinus", "euclidienne"]
reference = "produit_scalaire"

# --------------------------------------------------------------------------- #
#  Bloc E — classification d'intention (expérience MLflow à part)
# --------------------------------------------------------------------------- #

[intention]
nom = "intention"
experience = "E2-etude-intention"
# Étiquettes : le mode de chacune des 69 questions (proposition 36, reconnaissance
# 28, refus 5). Référence naïve : toujours « proposition », soit 36 / 69.
reference_naive = "proposition"

[intention.voisins]
# Méthode 1 — plus proches voisins : vecteurs de question EmbeddingGemma (rôle
# « requete », préfixe de la configuration), cosinus ; chaque question classée par
# le vote de ses k plus proches voisines parmi les 68 autres ; à égalité de voix,
# la classe dont la voisine la plus proche est la plus proche ; à égalité de
# similarité, l'ordre des questions.
instance = "embeddinggemma"
k = [1, 3, 5, 7]

[intention.llm]
# Méthode 2 — LLM local, par Ollama (service non modifié ; keep_alive par requête,
# déchargement à la fin) ; le modèle doit tenir entier sur la carte, sinon arrêt.
url = "http://127.0.0.1:11434"
modele = "ministral-3:3b-instruct-2512-q4_K_M"
keep_alive = "10m"
temperature = 0.0
graine = 20261007
num_ctx = 2048
num_predict = 20
# Réponse contrainte aux trois valeurs : schéma JSON passé au moteur (`format`).
# Une sortie hors des trois valeurs est comptée, et comptée fausse.
invite = "config/invite_intention.toml"
