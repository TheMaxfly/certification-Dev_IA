[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesures-recherche"
version = "0.1.0"
description = "Banc de mesure de la recherche sur le jeu d'évaluation gelé : six configurations, métriques au grain entité, MLflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow==3.17.0",
    "numpy==2.5.3",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "scikit-learn==1.9.1",
    "service-embedding",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
# Le magasin local `mlflow/` (hors dépôt) ferait prendre le paquet `mlflow` pour
# un module du projet : classement fixé, le même sur tout poste.
known-third-party = ["mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
service-embedding = { path = "../09_service_embedding", editable = true }
