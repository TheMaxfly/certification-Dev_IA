# Version de Ruff du dépôt : `verification/verifier.sh` la lit ici (rev ci-dessous),
# pour que le poste et la chaîne de GitHub lancent la même.
#
# Le framework pre-commit n'est pas branché : les hooks actifs du dépôt sont ceux de
# `.githooks/`, activés par liens symboliques (CONTRIBUTING.md, « Les hooks »). Les six
# crochets génériques qui figuraient ici n'étaient joués nulle part : retirés le
# 2026-10-19 (chaîne de vérification, palier 2).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
