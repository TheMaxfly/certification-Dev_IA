# Harnais d'intégration : PostgreSQL jetable, schéma reconstruit depuis
# `database/migrations/` — la source de vérité du dépôt. Le module 02 ne
# transporte plus de DDL : il ne peut donc plus tester un schéma périmé.
#
# Enchaînement : db (sain) → migrations (15 fichiers) → role → fixture
#              → temoin → api → smoke.
#
#   docker compose -f compose.integration.yml run --rm --build smoke
#   docker compose -f compose.integration.yml down -v
#
# `run` plutôt que `up --abort-on-container-exit` : `migrations` et `fixture`
# sont des tâches qui se terminent, et l'abandon sur sortie de conteneur
# tuerait le harnais dès la fin des migrations.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apimanga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apimanga"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  # Même runner que `database/outils/fidelite.sh` : `migrate.py up` joue les
  # migrations dans l'ordre, une transaction par fichier, et refuse d'avancer
  # si un fichier déjà appliqué a changé. `database/` est monté en lecture
  # seule ; l'image de l'API fournit psycopg, seule dépendance du runner.
  migrations:
    build: .
    image: api-manga-integration
    entrypoint: ["python", "/database/migrate.py", "up"]
    environment:
      DATABASE_URL: postgresql://postgres:integration-test@db:5432/apimanga
    volumes:
      - ../database:/database:ro
    depends_on:
      db:
        condition: service_healthy

  # Rôle de connexion de l'API. C'est LA procédure d'accès du dépôt qui est
  # exécutée ici — `database/outils/creer_role_lecture.sh`, sans variante ni
  # raccourci : une procédure que les tests n'exercent pas n'est qu'une
  # intention. Le script est en POSIX sh pour tourner dans busybox.
  # Mot de passe jetable, propre au harnais.
  role:
    image: postgres:16-alpine
    entrypoint:
      - sh
      - /outils/creer_role_lecture.sh
      - postgresql://postgres:integration-test@db:5432/apimanga
    environment:
      MANGA_API_PASSWORD: role-integration-test
    volumes:
      - ../database/outils:/outils:ro
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Jeu d'essai réservé aux tests : un document par source du corpus RAG.
  # Chargé en `postgres` : `manga_api` ne peut pas écrire, c'est tout l'objet
  # de l'étape.
  fixture:
    image: postgres:16-alpine
    entrypoint:
      - psql
      - postgresql://postgres:integration-test@db:5432/apimanga
      - --set=ON_ERROR_STOP=1
      - --file=/fixtures/002_sample_data.sql
    volumes:
      - ./tests/fixtures:/fixtures:ro
    depends_on:
      role:
        condition: service_completed_successfully

  # Témoin positif : prouve que la restriction EXISTE, en tentant une écriture
  # sous le rôle de l'API et en exigeant un refus 42501. Un test qui constate
  # que la lecture fonctionne encore ne prouverait rien.
  temoin:
    build: .
    image: api-manga-integration
    entrypoint: ["python", "/tests/db_temoin_lecture_seule.py"]
    environment:
      # Le témoin construit son DSN avec `app.database.build_conninfo`, comme
      # l'API : il prouve ainsi le rôle de la connexion réelle, pas d'une
      # connexion fabriquée pour le test. Le script étant hors de /app,
      # PYTHONPATH doit désigner le paquet.
      PYTHONPATH: /app
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: apimanga
      DB_USER: manga_api
      DB_PASSWORD: role-integration-test
    volumes:
      - ./tests:/tests:ro
    depends_on:
      fixture:
        condition: service_completed_successfully

  api:
    build: .
    image: api-manga-integration
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: apimanga
      # L'API tourne sous le rôle de consultation, comme en production.
      DB_USER: manga_api
      DB_PASSWORD: role-integration-test
      # Trousseau jetable du harnais. L'API refusant de démarrer sans clé, ce
      # service ne peut plus passer `healthy` si la variable disparaît : le
      # harnais teste donc aussi, par construction, que l'autorisation est
      # câblée. Le smoke reçoit LA MÊME valeur et rien d'autre.
      API_KEYS: app_backend:cle-jetable-du-harnais-0123456789abcdef
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 3
    depends_on:
      temoin:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 15

  smoke:
    image: python:3.12-slim
    command: ["python", "/tests/http_smoke.py"]
    environment:
      API_KEY: cle-jetable-du-harnais-0123456789abcdef
    volumes:
      - ./tests:/tests:ro
    depends_on:
      api:
        condition: service_healthy
