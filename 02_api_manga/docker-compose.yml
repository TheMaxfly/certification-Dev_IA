services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-API Manga}
      APP_VERSION: ${APP_VERSION:-0.4.0}
      # Trousseau d'autorisation. Transmis vide s'il est absent de
      # l'environnement : c'est alors l'API qui refuse de démarrer, avec un
      # message explicite. Le refus appartient à l'application, en un seul
      # endroit — un `${API_KEYS:?}` le dupliquerait ici et casserait
      # `docker compose config`, qui n'a pas à connaître de clé.
      API_KEYS: ${API_KEYS:-}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-apimanga}
      DB_USER: ${DB_USER:-manga_api}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
